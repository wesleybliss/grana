name: Flutter CI/CD

permissions:
  contents: write

on:
  push:
    branches: [master, develop]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 1. Bump build number (versionCode) in pubspec.yaml
      - name: Bump versionCode in pubspec.yaml
        run: |
          python3 -c "
          import os, re, sys

          with open('pubspec.yaml', 'r') as f:
              content = f.read()

          match = re.search(r'^version:\s*([^\+\s]+)\+(\d+)', content, re.MULTILINE)
          if not match:
              print('Error: version (x.y.z+code) not found in pubspec.yaml', file=sys.stderr)
              sys.exit(1)

          version_name = match.group(1)
          current_code = int(match.group(2))
          new_code = current_code + 1

          content = re.sub(
              r'^version:\s*[^\+\s]+\+\d+',
              f'version: {version_name}+{new_code}',
              content,
              count=1,
              flags=re.MULTILINE,
          )

          with open('pubspec.yaml', 'w') as f:
              f.write(content)

          env_file = os.getenv('GITHUB_ENV')
          if env_file:
              with open(env_file, 'a') as ef:
                  ef.write(f'NEW_VERSION_CODE={new_code}\n')
                  ef.write(f'VERSION_NAME={version_name}\n')

          print(f'Bumped versionCode from {current_code} to {new_code} (versionName: {version_name})')
          "

      # 2. Commit and push bumped version with [skip ci]
      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore(release): bump versionCode to ${{ env.NEW_VERSION_CODE }} [skip ci]"
          git push origin ${{ github.ref_name }}

      # 3. Setup Java & Flutter environment
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - run: flutter pub get

      # 4. Setup Google Services (Firebase Crashlytics, etc.)
      - name: Setup Google Services
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            mkdir -p android/app/src/standard
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/src/standard/google-services.json
            cp android/app/src/standard/google-services.json android/app/google-services.json
            echo "google-services.json configured."
          else
            echo "GOOGLE_SERVICES_JSON secret not set, skipping."
          fi
          if [ -n "$FIREBASE_OPTIONS_DART" ]; then
            echo "$FIREBASE_OPTIONS_DART" | base64 -d > lib/firebase_options.dart
            echo "lib/firebase_options.dart configured."
          else
            echo "FIREBASE_OPTIONS_DART secret not set, skipping."
          fi

      - run: flutter test

      # 5. Set up signing
      - name: Setup Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/release-key.jks
            KEY_PASS="${KEY_PASSWORD:-$STORE_PASSWORD}"
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s/keystore/release-key.jks\n" \
              "$STORE_PASSWORD" "$KEY_PASS" "$KEY_ALIAS" "$(pwd)" > key.properties
            cp key.properties android/key.properties
            echo "Release keystore and key.properties configured."
          else
            echo "KEYSTORE_BASE64 secret not set, skipping."
          fi

      # Sanitize branch name for filenames
      - name: Prepare branch name
        run: |
          BRANCH="$GITHUB_REF_NAME"
          SAFE=$(echo "$BRANCH" | tr '/ ' '-' | tr -cd '[:alnum.]._-')
          echo "BRANCH=$SAFE" >> $GITHUB_ENV
          echo "Using branch name: $SAFE"

      # 6. Build both flavors (standard and foss)
      - name: Build APKs (standard + foss)
        run: |
          flutter build apk --release --flavor standard
          flutter build apk --release --flavor foss

      - name: Rename APKs and create checksums
        run: |
          set -euo pipefail
          
          # Locate the built APKs (Flutter output)
          STD_APK="build/app/outputs/flutter-apk/app-standard-release.apk"
          FOSS_APK="build/app/outputs/flutter-apk/app-foss-release.apk"
          
          if [ ! -f "$STD_APK" ] || [ ! -f "$FOSS_APK" ]; then
            echo "Error: Could not locate both flavor APKs. Available APKs:"
            find build/app/outputs -type f -name "*.apk" 2>/dev/null || echo "No APKs found"
            exit 1
          fi
          
          # Rename APKs
          mv "$STD_APK" "grana-${{ env.BRANCH }}.apk"
          mv "$FOSS_APK" "grana-${{ env.BRANCH }}-foss.apk"
          
          # Generate SHA1 checksums
          sha1sum "grana-${{ env.BRANCH }}.apk" > "grana-${{ env.BRANCH }}.apk.sha1"
          sha1sum "grana-${{ env.BRANCH }}-foss.apk" > "grana-${{ env.BRANCH }}-foss.apk.sha1"
          
          # List generated files
          ls -lh grana-*.apk*

      # 7. Upload to Firebase App Distribution
      - name: Upload APK to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CREDENTIALS }}
          groups: alpha-testers
          file: grana-${{ env.BRANCH }}.apk
          releaseNotes: "Release v${{ env.VERSION_NAME }} (build ${{ env.NEW_VERSION_CODE }}) - ${{ github.sha }}"

      # Upload both flavor APKs as artifacts
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: grana-apks-${{ env.BRANCH }}
          path: |
            grana-${{ env.BRANCH }}.apk
            grana-${{ env.BRANCH }}.apk.sha1
            grana-${{ env.BRANCH }}-foss.apk
            grana-${{ env.BRANCH }}-foss.apk.sha1

      # Prepare release tag (master-only)
      - name: Prepare release tag
        if: success() && github.ref_name == 'master'
        run: |
          set -euo pipefail
          # Generate date-based tag (UTC)
          TAG="v$(date -u +'%Y.%m.%d').${{ env.NEW_VERSION_CODE }}"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=Grana $TAG" >> "$GITHUB_ENV"
          echo "Generated release tag: $TAG"

      # Create GitHub Release with both flavors (master-only)
      - name: Create GitHub Release
        if: success() && github.ref_name == 'master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            grana-${{ env.BRANCH }}.apk
            grana-${{ env.BRANCH }}.apk.sha1
            grana-${{ env.BRANCH }}-foss.apk
            grana-${{ env.BRANCH }}-foss.apk.sha1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

